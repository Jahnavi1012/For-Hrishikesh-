<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Hrishikesh ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="lockScreen">
<h2>Enter Password</h2>
<input type="password" id="passwordInput">
<button onclick="checkPassword()">Enter</button>
<p id="error"></p>
</div>

<div id="mainContent">

<h1 class="glow">For Hrishikesh ❤️</h1>

<p id="typeText"></p>

<div class="gallery">
<img src="photo1.JPG">
<img src="photo2.jpg">
<img src="photo3.jpg">
</div>

<button onclick="reveal()">Open when you miss me</button>

<button onclick="reveal()">Open when you miss me ❤️</button>

<p id="hiddenMessage" style="display:none; font-size:20px; margin-top:20px; color:pink;">
Even with miles between us, nothing has changed.
I still find you in every little moment.
You are, and always will be, my home.
</p>

<audio autoplay loop>
<source src="Edd_Sheeran_-_Perfect_(mp3.pm).mp3" type="audio/mpeg">
</audio>

</div>

<script src="script.js"></script>

 <script>
function createHeart() {
  const heart = document.createElement("div");
  heart.innerHTML = "❤️";
  heart.style.position = "fixed";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.top = "-10px";
  heart.style.fontSize = "20px";
  heart.style.animation = "fall 5s linear";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 5000);
}

setInterval(createHeart, 300);
   function reveal() {
var msg = document.getElementById("hiddenMessage");
msg.style.display = "block";
   }
</script>

<style>
@keyframes fall {
  to {
    transform: translateY(100vh);
  }
}
</style>
</body>
</html>
